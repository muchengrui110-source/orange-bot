# ============================================================================
# dsh-qq-bridge —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时把这个插件插进 profile 的配置树。
# 个人配置不写这里 —— 放在 profile 的 cordis.patch.yml 里按 id 覆盖，
# 或者用「设置 → QQ 桥接」页（写 <DSH_HOME>\qq-bridge\settings-ui.json）。
#
# ⚠️ `name:` 必须与安装后的包名完全一致（这里是 dsh-qq-bridge）。
# ============================================================================

- insert:
    - id: qq-bridge
      name: dsh-qq-bridge

